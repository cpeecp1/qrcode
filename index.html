<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時掃碼系統</title>
  <!-- 改用速度更快且穩定的 jsdelivr CDN 載入套件 -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 15px; background: #111; color: white; margin: 0; }
    h3 { margin: 10px 0 15px; font-weight: normal; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #00c853; min-height: 250px; background: #000; }
    #start-btn {
      margin: 15px auto; padding: 14px 28px; font-size: 18px; font-weight: bold;
      color: white; background: #00c853; border: none; border-radius: 8px; cursor: pointer;
    }
    #result-box { margin: 15px auto; max-width: 400px; padding: 15px; border-radius: 8px; background: #222; font-size: 16px; line-height: 1.6; white-space: pre-line; }
    .success { border-left: 6px solid #00c853; color: #b9f6ca; }
    .error { border-left: 6px solid #ff5252; color: #ffcdd2; }
    .processing { border-left: 6px solid #ffd740; color: #ffe57f; }
  </style>
</head>
<body>
  <h3>即時掃碼系統</h3>
  <div id="reader"></div>
  <!-- 加上實體按鈕，確保 100% 觸發 iPhone 相機授權 -->
  <button id="start-btn" onclick="startCamera()">點此啟動相機掃碼</button>
  <div id="result-box">請點擊上方綠色按鈕開啟鏡頭</div>

  <script>
    // 請確認這裡換成你自己的 GAS 部署網址（/exec 結尾）
    const GAS_URL = "https://google.com";
    
    let html5QrCode;
    const resultBox = document.getElementById('result-box');
    const startBtn = document.getElementById('start-btn');
    let isLocked = false;

    function onScanSuccess(decodedText) {
      if (isLocked) return;
      isLocked = true;

      resultBox.className = "processing";
      resultBox.innerText = `掃描到編碼：${decodedText}\n傳送寫入中...`;

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ code: decodedText })
      })
      .then(response => response.json())
      .then(res => {
        resultBox.className = res.success ? "success" : "error";
        resultBox.innerText = res.message;
        setTimeout(() => { isLocked = false; }, 1500);
      })
      .catch(err => {
        resultBox.className = "error";
        resultBox.innerText = "寫入失敗：" + err;
        isLocked = false;
      });
    }

    function startCamera() {
      // 檢查套件是否已載入
      if (typeof Html5Qrcode === "undefined") {
        resultBox.className = "error";
        resultBox.innerText = "掃碼套件載入失敗，請檢查網路連線後重新整理網頁。";
        return;
      }

      resultBox.className = "processing";
      resultBox.innerText = "正在請求相機權限...";

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 250, height: 180 } },
        onScanSuccess
      ).then(() => {
        startBtn.style.display = "none"; // 啟動成功後隱藏按鈕
        resultBox.className = "";
        resultBox.innerText = "鏡頭已就緒，請將條碼對準掃描框";
      }).catch((err) => {
        resultBox.className = "error";
        resultBox.innerText = "無法開啟鏡頭：" + err;
      });
    }
  </script>
</body>
</html>
